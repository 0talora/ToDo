<header class="cabecera">
  <div class="barra">
    <span class="marca">otalora<span class="led" aria-hidden="true"></span></span>
  </div>
</header>
<div class="preferences">
  <label>
    {{ i18n.strings.theme }}
    <select id="theme" [ngModel]="themePreference.value()" (ngModelChange)="themePreference.set($event)">
        @for (choice of themePreference.choices; track choice) {
          <option [value]="choice">{{ i18n.strings.themeChoices[choice] }}</option>
        }
    </select>
  </label>
  <label>
    {{ i18n.strings.language }}
    <select id="language" [ngModel]="i18n.languageChoice" (ngModelChange)="i18n.changeLanguage($event)">
      <option value="system">{{ i18n.strings.themeChoices.system }}</option>
        @for (code of languageCodes; track code) {
          <option [value]="code" [attr.lang]="code">{{ languages[code] }}</option>
        }
    </select>
  </label>
</div>

<main class="contenedor">
  <header class="introduccion">
    <div>
      <h1>{{ i18n.strings.title }}</h1>
      <p>{{ i18n.strings.description }}</p>
    </div>
    <div class="emblema" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <rect x="6" y="5" width="20" height="23" rx="3"/>
        <path d="m11 16 3 3 7-7"/>
      </svg>
    </div>
  </header>
  <app-tareas-component />
  <section class="search-guide">
    <h2>{{ i18n.strings.heading }}</h2>
    @for (paragraph of i18n.strings.paragraphs; track $index) {
      <p>{{ paragraph }}</p>
    }
  </section>
</main>
<app-footer />
<router-outlet />
