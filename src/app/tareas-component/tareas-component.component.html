<section aria-labelledby="task-list">
  <h2 id="task-list">{{ i18n.strings.list }}</h2>
  <form (ngSubmit)="addTarea(taskInput)">
    <label for="task">{{ i18n.strings.task }}</label>
    <div class="acciones">
      <input #taskInput id="task" type="text">
      <button class="principal" type="submit">{{ i18n.strings.add }}</button>
    </div>
  </form>

  <p class="estado" role="status">{{ notice ? i18n.strings[notice] : '' }}</p>

  <ul>
    @for (tarea of adminTareas.tareasOrdenadas(); track tarea) {
      <li [class.completada]="tarea.completada">
        <label>
          <input type="checkbox" [ngModel]="tarea.completada" (ngModelChange)="adminTareas.cambiarEstado(tarea, $event)">
          <span>{{ tarea.nombreTarea | apper }}</span>
        </label>
        <button type="button" [attr.aria-label]="i18n.strings.remove + ' ' + tarea.nombreTarea"
          (click)="borrarTarea(tarea, taskInput)">{{ i18n.strings.remove }}</button>
      </li>
    }
  </ul>

  @if (adminTareas.tareas.length) {
    <button class="borrar-todas" type="button" (click)="borrarTodasTareas(taskInput)">{{ i18n.strings.clear }}</button>
  } @else {
    <p class="vacio">{{ i18n.strings.empty }}</p>
  }
</section>
